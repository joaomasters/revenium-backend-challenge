services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usage_rating
      POSTGRES_USER: ${DB_USERNAME:-usage_rating}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d usage_rating"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usage_rating
      DB_USERNAME: ${DB_USERNAME:-usage_rating}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      TENANT_API_KEYS: ${TENANT_API_KEYS:?set TENANT_API_KEYS in .env (see .env.example)}
    ports:
      - "8080:8080"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
